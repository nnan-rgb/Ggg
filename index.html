<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميلو احبك يا قلبي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }

        .heart {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            transform-origin: center center;
            z-index: 1;
        }

        .heart svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 6px rgba(139, 0, 0, 0.6));
        }

        .heart svg path {
            fill: url(#burgundy);
        }

        .heart.hollow svg path {
            fill: transparent;
            stroke: url(#burgundy);
            stroke-width: 1.5px;
            stroke-linejoin: round;
        }

        /* الحاوية الرئيسية التي تجمع المستطيل والأزرار معاً وترتبهم فوق بعض */
        .master-wrapper {
            position: absolute;
            top: 45%; 
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px; /* المسافة بين المستطيل والأزرار التي تحته */
            width: max-content;
            max-width: 95%;
        }

        /* حاوية المستطيل الأصفر (للنصوص فقط) */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: none; 
            text-align: center;
            padding: 20px 40px;

            border: 3px solid;
            border-image: linear-gradient(
                to right, 
                rgba(255, 252, 3, 0) 0%,      
                rgba(255, 252, 3, 1) 50%,     
                rgba(255, 252, 3, 0) 100%     
            ) 1;
        }

        .main-text {
            font-size: clamp(38px, 9vw, 95px); 
            font-weight: 900;
            font-style: italic;
            letter-spacing: 2px;
            color: #800020; 
            white-space: nowrap; 
        }

        .sub-text {
            font-size: clamp(26px, 6vw, 65px); 
            font-weight: bold;
            font-style: italic;
            color: #800020; 
            white-space: nowrap; 
        }

        /* حاوية الأزرار (أصبحت تحت المستطيل) */
        .buttons-container {
            display: flex;
            gap: 25px;
            pointer-events: auto; 
        }

        .btn {
            padding: 12px 40px;
            font-size: 26px;
            font-weight: bold;
            border: none;
            border-radius: 8px; 
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            font-family: inherit;
        }

        .btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .btn-yes {
            background-color: #ff0000;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }

        .btn-no {
            background-color: #c0c0c0;
            color: #000;
            box-shadow: 0 4px 15px rgba(192, 192, 192, 0.3);
        }

        @media (max-width: 480px) {
            .logo-container {
                padding: 15px 20px;
            }
            .btn {
                padding: 10px 30px;
                font-size: 22px;
            }
            .master-wrapper {
                gap: 30px;
            }
        }
    </style>
</head>
<body>

    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <linearGradient id="burgundy" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#4a0000;stop-opacity:1" />
                <stop offset="25%" style="stop-color:#6b0000;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#800020;stop-opacity:1" />
                <stop offset="75%" style="stop-color:#6b0000;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#3d0000;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <div class="master-wrapper">
        
        <div class="logo-container">
            <div class="main-text">ميلو احبك يا قلبي</div>
            <div class="sub-text">انتي تحبيني</div>
        </div>
        
        <div class="buttons-container">
            <button class="btn btn-yes" onclick="speakText('قُرْبَانُ قَلْبِكِ يَا رُوحِي')">اي</button>
            <button class="btn btn-no" onclick="speakText('لَا تَكْذِبِي.. أَعْرِفُكِ تُحِبِّينَنِي')">لا</button>
        </div>

    </div>

<script>
    // متغير لتخزين الصوت العربي المناسب إذا وجد
    let arabicVoice = null;

    // دالة لتحميل الأصوات المتاحة واختيار صوت عربي طبيعي
    function loadVoices() {
        const voices = window.speechSynthesis.getVoices();
        // البحث عن أي صوت يدعم اللغة العربية (ar)
        arabicVoice = voices.find(voice => voice.lang.startsWith('ar') && voice.default) ||
                      voices.find(voice => voice.lang.startsWith('ar')) ||
                      voices.find(voice => voice.lang === 'ar-SA') ||
                      null;
        // إذا لم نجد صوتاً عربياً، نتركه null وسيستخدم المتصفح الصوت الافتراضي للغة العربية
    }

    // طلب تحميل الأصوات (بعض المتصفحات تحتاج حدث onvoiceschanged)
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
    } else {
        loadVoices();
    }
    // أيضاً نحاول التحميل فوراً في حالة كانت الأصوات جاهزة مسبقاً
    loadVoices();

    function speakText(text) {
        // إلغاء أي كلام سابق لتجنب التداخل
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ar-SA';
        
        // ضبط المعدل الطبيعي (1.0) وجعله سريعاً قليلاً إذا أردت، 1.0 هو الطبيعي
        utterance.rate = 1.0;
        // ضبط النبرة إلى الطبيعية (1.0)
        utterance.pitch = 1.0;
        // مستوى الصوت (اختياري)
        utterance.volume = 1.0;
        
        // إذا وجدنا صوتاً عربياً مناسباً، نستخدمه لضمان نطق أفضل
        if (arabicVoice) {
            utterance.voice = arabicVoice;
        }
        
        // نطق النص
        window.speechSynthesis.speak(utterance);
    }

    const numHearts = 25; 
    const hearts = [];

    for (let i = 0; i < numHearts; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart');

        if (Math.random() < 0.8) {
            heart.classList.add('hollow');
        }

        const size = gsap.utils.random(20, 45);
        heart.style.width = size + 'px';
        heart.style.height = size + 'px';

        heart.innerHTML = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        `;

        document.body.appendChild(heart);
        hearts.push(heart);
    }

    function random(min, max) {
        return gsap.utils.random(min, max);
    }

    function animateHeart(heart) {
        const startX = random(-100, window.innerWidth + 100);
        const startY = random(-150, -50);
        const endY = window.innerHeight + 100;
        const duration = random(6, 14);
        const drift = random(-100, 100);
        const rotation = random(-20, 20);
        const scaleVariation = random(0.8, 1.2);

        gsap.set(heart, {
            x: startX,
            y: startY,
            scale: 0,
            rotation: rotation,
            opacity: 0
        });

        const tl = gsap.timeline({
            repeat: -1,
            repeatDelay: random(1, 6)
        });

        tl.to(heart, {
            scale: scaleVariation,
            opacity: random(0.5, 0.9),
            duration: 1.2,
            ease: "power2.out"
        })
        .to(heart, {
            y: endY,
            x: startX + drift,
            rotation: rotation + random(-15, 15),
            duration: duration,
            ease: "none"
        }, "<")
        .to(heart, {
            opacity: 0,
            scale: 0.3,
            duration: 2,
            ease: "power2.in"
        }, `-=${2}`);
    }

    hearts.forEach((heart) => {
        gsap.delayedCall(random(0, 10), () => {
            animateHeart(heart);
        });
    });

    setInterval(() => {
        const randomHeart = hearts[Math.floor(Math.random() * hearts.length)];
        gsap.set(randomHeart, {
            x: random(-100, window.innerWidth + 100),
            y: random(-150, -50)
        });
    }, 3000);

    window.addEventListener('resize', () => {
        hearts.forEach(heart => {
            gsap.set(heart, {
                x: random(-100, window.innerWidth + 100),
                y: random(-150, -50)
            });
        });
    });
</script>

</body>
</html>
